name: cluster-platform-console

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
      VITE_ALLOW_TOKEN_INJECTION: ${VITE_ALLOW_TOKEN_INJECTION:-false}
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_PORT:-5173}:5173"
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  frontend-node-modules: {}
